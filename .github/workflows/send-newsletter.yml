name: Send Newsletter (Manual / Scheduled)

on:
  schedule:
    - cron: '0 2 * * 1'   # Monday 10:00 SGT (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/newsletter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml markdown requests

      - name: Find latest newsletter
        id: find
        run: |
          python3 scripts/find_latest.py > latest.txt || (cat latest.txt || true; exit 1)
          latest="$(cat latest.txt)"
          echo "FILE=${latest}" >> $GITHUB_OUTPUT

      - name: Validate environment variables (Buttondown)
        if: steps.find.outputs.FILE != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_SUBJECT_PREFIX: ${{ secrets.BUTTONDOWN_SUBJECT_PREFIX }}
          BUTTONDOWN_DEFAULT_STATUS: ${{ secrets.BUTTONDOWN_DEFAULT_STATUS }}
          BUTTONDOWN_DEFAULT_FOOTER: ${{ secrets.BUTTONDOWN_DEFAULT_FOOTER }}
        run: |
          echo "=== Buttondown env check ==="
          errors=0
          if [[ -z "$BUTTONDOWN_API_KEY" ]]; then
            echo "::error::BUTTONDOWN_API_KEY is empty"
            errors=$((errors + 1))
          else
            echo "✅ BUTTONDOWN_API_KEY: Set (length: ${#BUTTONDOWN_API_KEY})"
          fi

          # optional hints
          if [[ -z "$BUTTONDOWN_DEFAULT_STATUS" ]]; then
            echo "::warning::BUTTONDOWN_DEFAULT_STATUS not set — defaulting to 'draft'"
          else
            echo "✅ BUTTONDOWN_DEFAULT_STATUS: $BUTTONDOWN_DEFAULT_STATUS"
          fi

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "❌ Validation failed with $errors error(s)"
            exit 1
          fi
          echo ""
          echo "✅ All environment variables are properly configured"

      - name: Create Buttondown draft
        if: steps.find.outputs.FILE != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_SUBJECT_PREFIX: ${{ secrets.BUTTONDOWN_SUBJECT_PREFIX }}
          BUTTONDOWN_DEFAULT_STATUS: ${{ secrets.BUTTONDOWN_DEFAULT_STATUS }}
          BUTTONDOWN_DEFAULT_FOOTER: ${{ secrets.BUTTONDOWN_DEFAULT_FOOTER }}
        run: |
          python3 scripts/publish_to_esp.py "${{ steps.find.outputs.FILE }}"

      - name: Append published.log
        if: success() && steps.find.outputs.FILE != ''
        run: |
          F="$(basename "${{ steps.find.outputs.FILE }}")"
          echo "$F | $(date -u +%FT%TZ) | published_to: buttondown" >> published.log
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add published.log || true
          git commit -m "log: newsletter published $F" || echo "No changes to commit"
          git push || echo "Push failed (check token permissions)"

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Send Newsletter workflow failed — ${{ github.run_id }}"
          content: |
            Send Newsletter workflow failed. Check Actions logs for details.
            **Note:** Ensure you added the Buttondown API key as repo secret: BUTTONDOWN_API_KEY
