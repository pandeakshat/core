name: Send Newsletter (Manual / Scheduled)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/newsletter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml markdown requests

      - name: Find latest newsletter
        id: find
        run: |
          python3 scripts/find_latest.py > latest.txt || (cat latest.txt || true; exit 1)
          latest="$(cat latest.txt)"
          echo "FILE=${latest}" >> $GITHUB_OUTPUT

      - name: Validate environment variables
        if: steps.find.outputs.FILE != ''
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
          MAILERLITE_FROM_EMAIL: ${{ secrets.MAILERLITE_FROM_EMAIL }}
          MAILERLITE_FROM_NAME: ${{ secrets.MAILERLITE_FROM_NAME }}
        run: |
          echo "=== Environment Variable Validation ==="
          errors=0

          # Check API Key format (new API keys are ~1000 chars)
          if [[ -z "$MAILERLITE_API_KEY" ]]; then
            echo "::error::MAILERLITE_API_KEY is empty"
            errors=$((errors + 1))
          elif [[ ${#MAILERLITE_API_KEY} -lt 50 ]]; then
            echo "::warning::API key seems short (${#MAILERLITE_API_KEY} chars). Are you using the new API key?"
          else
            echo "✅ MAILERLITE_API_KEY: Set (${#MAILERLITE_API_KEY} chars)"
          fi

          # Check Group ID is numeric
          if [[ -z "$MAILERLITE_GROUP_ID" || "$MAILERLITE_GROUP_ID" == "0" ]]; then
            echo "::error::MAILERLITE_GROUP_ID is empty or placeholder"
            errors=$((errors + 1))
          elif ! [[ "$MAILERLITE_GROUP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::MAILERLITE_GROUP_ID must be numeric: $MAILERLITE_GROUP_ID"
            errors=$((errors + 1))
          else
            echo "✅ MAILERLITE_GROUP_ID: $MAILERLITE_GROUP_ID"
          fi

          # Show email and name for debugging (not masked here)
          if [[ -z "$MAILERLITE_FROM_EMAIL" ]]; then
            echo "::error::MAILERLITE_FROM_EMAIL is empty"
            errors=$((errors + 1))
          else
            echo "✅ MAILERLITE_FROM_EMAIL: $MAILERLITE_FROM_EMAIL"
          fi

          if [[ -z "$MAILERLITE_FROM_NAME" ]]; then
            echo "::error::MAILERLITE_FROM_NAME is empty"
            errors=$((errors + 1))
          else
            echo "✅ MAILERLITE_FROM_NAME: $MAILERLITE_FROM_NAME"
          fi

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "❌ Validation failed with $errors error(s)"
            exit 1
          fi
          echo ""
          echo "✅ All environment variables are properly configured"

      - name: Create MailerLite draft
        if: steps.find.outputs.FILE != ''
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
          MAILERLITE_FROM_EMAIL: ${{ secrets.MAILERLITE_FROM_EMAIL }}
          MAILERLITE_FROM_NAME: ${{ secrets.MAILERLITE_FROM_NAME }}
        run: |
          python3 scripts/publish_to_esp.py "${{ steps.find.outputs.FILE }}"

      - name: Append published.log
        if: success() && steps.find.outputs.FILE != ''
        run: |
          F="$(basename "${{ steps.find.outputs.FILE }}")"
          echo "$F | $(date -u +%FT%TZ) | published_to: newsletter" >> published.log
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add published.log || true
          git commit -m "log: newsletter published $F" || echo "No changes to commit"
          git push || echo "Push failed (check token permissions)"

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Send Newsletter workflow failed — ${{ github.run_id }}"
          content: |
            Send Newsletter workflow failed. Check Actions logs for details.
            **Note:** Ensure you're using the NEW MailerLite API key from:
            https://dashboard.mailerlite.com/integrations/api
