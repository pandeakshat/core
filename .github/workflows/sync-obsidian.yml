name: Sync Obsidian Content (Blog + Newsletter + Welcome)

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 3 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core repository
        uses: actions/checkout@v4

      - name: Checkout private Obsidian repo
        uses: actions/checkout@v4
        with:
          repository: pandeakshat/base
          token: ${{ secrets.OBSIDIAN_SYNC_TOKEN }}
          path: obsidian

      # -------------------------------------------------------------
      # BLOG SYNC → pandeakshat-portfolio/src/content/blog
      # -------------------------------------------------------------
      - name: Sync Blog markdown files
        run: |
          mkdir -p pandeakshat-portfolio/src/content/blog
          find obsidian/Projects/PandeAkshat/Write/Blog -type f -name "*.md" \
            -exec cp {} pandeakshat-portfolio/src/content/blog/ \;
          echo "✅ Synced blog files."

      # -------------------------------------------------------------
      # NEWSLETTER SYNC → automation/newsletter/newsletters
      # -------------------------------------------------------------
      - name: Sync weekly newsletters
        run: |
          mkdir -p automation/newsletter/newsletters
          find obsidian/Projects/PandeAkshat/Write/Newsletter -type f -name "newsletter-*.md" \
            -exec cp -u {} automation/newsletter/newsletters/ \;
          echo "✅ Synced newsletter files."

      # -------------------------------------------------------------
      # WELCOME SYNC → automation/newsletter/welcome
      # -------------------------------------------------------------
      - name: Sync welcome templates
        run: |
          mkdir -p automation/newsletter/welcome
          cp -u obsidian/Projects/PandeAkshat/Write/Newsletter/Welcome/mid-series.md automation/newsletter/welcome/ 2>/dev/null || true
          cp -u obsidian/Projects/PandeAkshat/Write/Newsletter/Welcome/post-series.md automation/newsletter/welcome/ 2>/dev/null || true
          echo "✅ Synced welcome templates."

      # -------------------------------------------------------------
      # COMMIT CHANGES
      # -------------------------------------------------------------
      - name: Commit synced content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pandeakshat-portfolio/src/content/blog/ || true
          git add automation/newsletter/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync blog + newsletter content from Obsidian"
            git push
          fi
